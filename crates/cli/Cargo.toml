[package]
name = "wave-cli"
description = "`synkopa` — drive the open Synkopa project from a terminal or an agent."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "wave_cli"
path = "src/lib.rs"

[[bin]]
name = "synkopa"
path = "src/main.rs"

# The command's name before the rename; kept so existing scripts keep working.
[[bin]]
name = "wave"
path = "src/wave_alias.rs"

[dependencies]
wave-session.workspace = true
wave-engine.workspace = true
serde_json.workspace = true
