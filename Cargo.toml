[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/audio-io",
    "crates/session",
    "crates/cli",
    "app",
    "crates/audio-file",
    "crates/midi-in",
    "crates/perf",
    "crates/keys-prep",
    "crates/stretch",
    # the vendored automation bridge: a member so its handshake regression test runs in CI
    "crates/vendor/mcp-bridge",
]

[workspace.package]
edition = "2021"
version = "0.4.0"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
# --- real-time plumbing ---
rtrb = "0.4"            # lock-free SPSC ring: UI/engine thread <-> audio callback
# --- audio I/O ---
cpal = "0.18"           # WASAPI / ASIO (feature "asio") / CoreAudio / ALSA / JACK (Linux)
# --- decoding (non-RT only) ---
symphonia = { version = "0.6", default-features = false, features = ["flac", "wav", "aiff", "pcm", "ogg", "vorbis"] }
minimp3 = "0.5"
hound = "3"
realfft = "3"
# --- library download ---
ureq = { version = "3", features = ["platform-verifier"] }
sha2 = "0.10"
# --- general ---
thiserror = "2"
log = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
interprocess = "2"
uuid = { version = "1", features = ["v4"] }

wave-engine = { path = "crates/engine" }
wave-audio-io = { path = "crates/audio-io" }
wave-audio-file = { path = "crates/audio-file" }
wave-session = { path = "crates/session" }
wave-midi-in = { path = "crates/midi-in" }
wave-stretch = { path = "crates/stretch" }

[profile.dev]
opt-level = 1           # DSP in debug is unusably slow otherwise

[profile.dev.package."*"]
opt-level = 3
# No DWARF for dependencies: a full `cargo test --workspace` links ~110
# binaries, and dep debuginfo was the bulk of the multi-100-GB target growth.
# "*" never matches workspace members, so own crates stay fully debuggable.
debug = false

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
# the vendored bridge refuses Origin-bearing handshakes (see crates/vendor/mcp-bridge/README.synkopa.md)
tauri-plugin-mcp-bridge = { path = "crates/vendor/mcp-bridge" }
